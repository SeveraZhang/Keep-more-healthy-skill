version: 1.0.4

conversation:
  quick_start_max_questions: 4
  overwhelmed_user_max_questions: 2
  max_immediate_actions: 3
  max_follow_up_questions: 1
  default_language: zh-CN
  tables_by_default: false
  sensitive_question_opt_out: true
  sensitive_question_opt_out_phrase: "不方便回答或直接说不回答都可以"
  sensitive_question_action_on_decline: conservative_plan_and_state_limit
  repeat_measurement_questions: false
  ask_measurement_again_only_if: [user_updates, recalculation_requested, stale_or_safety_critical]
  encouragement_style: warm_specific_conditional

recordkeeping:
  remember_confirmed_measurements: true
  require_user_consent_before_saving: true
  store_measurement_date: true

calculation:
  bmr_method: mifflin_st_jeor
  activity_factors:
    sedentary: 1.2
    light: 1.375
    moderate: 1.55
    very_active: 1.725
  trend_review_days: 14

planning:
  default_energy_deficit_kcal_range: [250, 500]
  weekly_weight_change_pct_range: [0.25, 0.75]
  max_weekly_priorities: 3
  default_walk_minutes: 20
  default_weekly_strength_sessions: 2

habits:
  daily_checkin_required: false
  weekly_minimum_records: 2
  reminders_opt_in: true
  missed_task_response: deescalate

safety:
  red_flag_action: stop_plan_and_refer
  high_stress_plan_mode: deescalate
  binge_response_mode: normalize_and_resume
  photo_body_fat_estimation: prohibited
